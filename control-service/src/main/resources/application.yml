spring:
  application:
    name: control-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/baro_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

mqtt:
  # mode 선택
  #   local    : 로컬 Mosquitto (개발/테스트)
  #   aws      : AWS IoT Core, 인터넷 경유 (로컬 PC → 퍼블릭 endpoint)
  #   aws-vpc  : AWS IoT Core, VPC PrivateLink 경유 (ECS/EKS 배포 시)
  #              endpoint만 VPC endpoint DNS로 바꾸면 나머지 설정은 aws와 동일
  mode: ${MQTT_MODE:local}
  client-id: control-service
  local:
    host: ${LOCAL_MQTT_HOST:localhost}
    port: ${LOCAL_MQTT_PORT:1883}
  aws:
    # [aws]     endpoint = <account-id>-ats.iot.ap-northeast-2.amazonaws.com
    # [aws-vpc] endpoint = <vpce-id>.data.iot.ap-northeast-2.vpce.amazonaws.com
    endpoint: ${IOT_ENDPOINT:}
    cert-path: ${IOT_CERT_PATH:}
    key-path: ${IOT_KEY_PATH:}
    ca-path: ${IOT_CA_PATH:}
    port: ${IOT_PORT:8883}

dispatch:
  service:
    url: ${DISPATCH_SERVICE_URL:http://localhost:8082}

