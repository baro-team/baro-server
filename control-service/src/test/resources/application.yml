spring:
  application:
    name: control-service
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: never  # schema.sql은 PostGIS 포함 — H2에서 실행 불가
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8081

mqtt:
  mode: local
  client-id: control-service-test
  local:
    host: localhost
    port: 1883
  aws:
    endpoint: ""
    cert-path: ""
    key-path: ""
    ca-path: ""
    port: 8883

kafka:
  topic:
    vehicle-data: vehicle-data-topic

dispatch:
  service:
    url: http://localhost:8082
