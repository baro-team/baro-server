spring:
  application:
    name: dispatch-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_DISPATCH_CONSUMER_GROUP_ID:dispatch-service}
  datasource:
    url: ${DISPATCH_DB_URL}
    username: ${DISPATCH_DB_USERNAME}
    password: ${DISPATCH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

kafka:
  topic:
    dispatch-events: ${KAFKA_DISPATCH_EVENTS_TOPIC:dispatch-events-topic}
    vehicle-data: ${KAFKA_VEHICLE_DATA_TOPIC:vehicle-data-topic}
baro:
  error:
    include-details: ${BARO_ERROR_INCLUDE_DETAILS:false}
  cors:
    allowed-origin-patterns: ${BARO_CORS_ALLOWED_ORIGIN_PATTERNS:https://dev.barocloud.com,http://localhost:*}
  openapi:
    title: Dispatch Service API
    description: BARO dispatch-service API documentation
    version: v1
  jwt:
    secret: ${JWT_SECRET}
