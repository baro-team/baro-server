spring:
  application:
    name: dispatch-service
  datasource:
    url: ${DISPATCH_DB_URL}
    username: ${DISPATCH_DB_USERNAME}
    password: ${DISPATCH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

baro:
  openapi:
    title: Dispatch Service API
    description: BARO dispatch-service API documentation
    version: v1
  jwt:
    secret: ${JWT_SECRET}
