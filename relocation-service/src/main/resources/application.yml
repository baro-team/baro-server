spring:
  application:
    name: relocation-service
  datasource:
    url: ${RELOCATION_DB_URL}
    username: ${RELOCATION_DB_USERNAME}
    password: ${RELOCATION_DB_PASSWORD}
    hikari:
      connection-init-sql: SET search_path TO relocation_service, public;
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul
    show-sql: true

logging:
  level:
    com.baro.relocation: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /relocation/api-docs
  swagger-ui:
    path: /relocation/swagger-ui.html

baro:
  openapi:
    title: Relocation Service API
    description: BARO relocation-service API documentation
    version: v1

internal:
  api-key: ${INTERNAL_API_KEY:default-secret-key-change-in-prod}

control:
  service:
    url: ${CONTROL_SERVICE_URL:http://localhost:8081}

kakao:
  mobility:
    base-url: ${KAKAO_MOBILITY_BASE_URL:https://apis-navi.kakaomobility.com}
    api-key: ${KAKAO_MOBILITY_API_KEY:}
