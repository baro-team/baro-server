name: Dispatch Service CI

on:
  pull_request:
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - '.github/workflows/ci-dispatch-service.yml'
      - 'common-core/**'
      - 'common-security/**'
      - 'common-web/**'
      - 'common-kakao/**'
      - 'dispatch-service/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle/**'
      - '.github/workflows/ci-dispatch-service.yml'
      - 'common-core/**'
      - 'common-security/**'
      - 'common-web/**'
      - 'common-kakao/**'
      - 'dispatch-service/**'

jobs:
  dispatch-service:
    name: Dispatch Service Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test dispatch-service
        run: ./gradlew :dispatch-service:clean :dispatch-service:build
