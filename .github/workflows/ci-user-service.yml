name: User Service CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
      - develop

jobs:
  user-service:
    name: User Service Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          elif [ "${{ github.event.action }}" = "synchronize" ]; then
            BASE=$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("before", ""))')
            HEAD=$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("after", ""))')
          else
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          fi

          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD")
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E '^(build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|gradlew\.bat|gradle/|\.github/workflows/ci-user-service\.yml|common-core/|common-security/|common-web/|user-service/)'; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.changes.outputs.run_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        if: steps.changes.outputs.run_build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test user-service
        if: steps.changes.outputs.run_build == 'true'
        run: ./gradlew :user-service:clean :user-service:build
